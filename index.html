<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Convite de Aniversário - Eloah Oliveira 🧜🏻‍♀️</title>

<!-- Metadados Open Graph para Pré-visualização Perfeita no WhatsApp -->
<meta property="og:title" content="Convite de Aniversário - Eloah Oliveira 🧜🏻‍♀️">
<meta property="og:description" content="Uma Aventura no Fundo do Mar — 29/01/2027 às 17:00h no Cenário Buffet, Guarujá.">
<meta property="og:image" content="https://festa-eloah-5-aninhos.github.io/Convite.Eloah/convite.jpg">
<meta property="og:url" content="https://festa-eloah-5-aninhos.github.io/Convite.Eloah/">
<meta property="og:type" content="website">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #02121e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #ffffff;
    overflow-x: hidden;
    position: relative;
  }

  /* Overlay de Entrada para Garantir a Execução do Áudio no Telemóvel */
  .start-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #063455 0%, #02121e 100%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  .start-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .start-btn {
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    color: #ffffff;
    border: 2px solid #ffffff;
    padding: 18px 32px;
    font-size: 18px;
    font-weight: 800;
    border-radius: 50px;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    cursor: pointer;
    animation: pulse 1.8s infinite;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
    50% { transform: scale(1.06); box-shadow: 0 0 30px rgba(56, 189, 248, 0.9); }
    100% { transform: scale(1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
  }

  .bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -50px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    animation: rise 8s infinite ease-in;
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    20% { opacity: 0.6; }
    100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
  }

  .card-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    background: linear-gradient(175deg, #063455 0%, #031b2e 50%, #0a4d7a 100%);
    border-radius: 28px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.25);
    border: 2px solid rgba(56, 189, 248, 0.4);
    padding: 24px 20px;
    text-align: center;
    backdrop-filter: blur(10px);
  }

  .invite-img {
    width: 100%;
    max-width: 360px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.3);
    margin-bottom: 20px;
  }

  .info-card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: left;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .info-row:last-child { margin-bottom: 0; }

  .info-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(56, 189, 248, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .info-text strong {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #38bdf8;
  }

  .info-text span {
    font-size: 14px;
    font-weight: 600;
    color: #f1f5f9;
  }

  .info-text small {
    display: block;
    font-size: 12px;
    color: #cbd5e1;
    margin-top: 2px;
  }

  .button-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .btn-confirm {
    background: linear-gradient(135deg, #25D366, #128C7E);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
  }

  .btn-location {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
  }

  .btn:active { transform: scale(0.97); }

  .audio-control {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: rgba(6, 63, 99, 0.9);
    border: 2px solid #38bdf8;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
  }
</style>
</head>
<body>

<!-- TELA DE ENTRADA OBRIGATÓRIA PARA LIBERAR O ÁUDIO NO TELEMÓVEL -->
<div class="start-overlay" id="startOverlay">
  <h2 style="font-size: 24px; margin-bottom: 10px;">Aniversário da Eloah 🧜🏻‍♀️</h2>
  <p style="font-size: 14px; color: #cbd5e1; margin-bottom: 25px;">Você recebeu um convite especial!</p>
  <button class="start-btn" id="startBtn">
    <span>ABRIR CONVITE COM MÚSICA</span> 🎵
  </button>
</div>

<div class="bubbles-container" id="bubbles"></div>

<button class="audio-control" id="audioBtn" title="Som">🔊</button>

<div class="card-container">
  <img src="convite.jpg" alt="Convite Eloah Oliveira" class="invite-img">

  <div class="info-card">
    <div class="info-row">
      <div class="info-icon">📅</div>
      <div class="info-text">
        <strong>Data & Horário</strong>
        <span>29/01/2027 às 17:00h</span>
      </div>
    </div>
    <div class="info-row">
      <div class="info-icon">📍</div>
      <div class="info-text">
        <strong>Local da Festa</strong>
        <span>Cenário Buffet</span>
        <small>Av. Miguel Estefno, 1501 - Jardim Três Marias, Guaruja (Frente à Praia da Enseada)</small>
      </div>
    </div>
  </div>

  <div class="button-group">
    <a href="https://wa.me/5513991887228?text=Olá!%20Gostaria%20de%20confirmar%20minha%20presença%20no%20aniversário%20da%20Eloah!%20✨🧜🏻‍♀️" class="btn btn-confirm" target="_blank">
      <span>CONFIRMAR PRESENÇA</span>
    </a>
    <a href="https://www.google.com/maps/search/?api=1&query=Cenario+Buffet+Av+Miguel+Estefno+1501+Guaruja" class="btn btn-location" target="_blank">
      <span>📍 VER NO MAPA</span>
    </a>
  </div>
</div>

<audio id="bgAudio" loop preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
  // Validação e criação segura das bolhas animadas de fundo
  const bubblesContainer = document.getElementById('bubbles');
  if (bubblesContainer) {
    for (let i = 0; i < 15; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 20 + 10 + 'px';
      bubble.style.width = size;
      bubble.style.height = size;
      bubble.style.left = Math.random() * 100 + '%';
      bubble.style.animationDelay = Math.random() * 8 + 's';
      bubble.style.animationDuration = (Math.random() * 4 + 6) + 's';
      bubblesContainer.appendChild(bubble);
    }
  }

  const audio = document.getElementById('bgAudio');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const audioBtn = document.getElementById('audioBtn');
  let isPlaying = false;

  if (startBtn && startOverlay && audio) {
    startBtn.addEventListener('click', function() {
      audio.play().then(() => {
        isPlaying = true;
        if (audioBtn) audioBtn.textContent = '🔊';
      }).catch(err => {
        console.log("Erro de reprodução:", err);
      });
      startOverlay.classList.add('hidden');
    });
  }

  if (audioBtn && audio) {
    audioBtn.addEventListener('click', function() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        audioBtn.textContent = '🔇';
      } else {
        audio.play().catch(err => console.log(err));
        isPlaying = true;
        audioBtn.textContent = '🔊';
      }
    });
  }
</script>

</body>
</html>
