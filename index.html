<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Convite de Aniversário - Eloah Oliveira</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #02121e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #ffffff;
    overflow-x: hidden;
    position: relative;
  }

  /* Efeito de Bolhas Submarinas Animadas */
  .bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -50px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    animation: rise 8s infinite ease-in;
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    20% { opacity: 0.6; }
    100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
  }

  /* Container Principal do Convite */
  .card-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    background: linear-gradient(175deg, #063455 0%, #031b2e 50%, #0a4d7a 100%);
    border-radius: 28px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.25);
    border: 2px solid rgba(56, 189, 248, 0.4);
    padding: 32px 24px;
    text-align: center;
    backdrop-filter: blur(10px);
  }

  /* Decoração de Topo */
  .header-icon {
    font-size: 45px;
    margin-bottom: 8px;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }

  .subtitle {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #a5f3fc;
    font-weight: 600;
  }

  .title {
    font-size: 34px;
    font-weight: 900;
    background: linear-gradient(180deg, #ffffff 30%, #a5f3fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 4px 0 6px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #9333ea, #c084fc);
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  /* Bloco de Informações */
  .info-card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: left;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .info-row:last-child { margin-bottom: 0; }

  .info-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(56, 189, 248, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .info-text strong {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #38bdf8;
  }

  .info-text span {
    font-size: 14px;
    font-weight: 600;
    color: #f1f5f9;
  }

  .info-text small {
    display: block;
    font-size: 12px;
    color: #cbd5e1;
    margin-top: 2px;
  }

  /* Botões Interativos */
  .button-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .btn-confirm {
    background: linear-gradient(135deg, #25D366, #128C7E);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
  }

  .btn-location {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
  }

  .btn:active { transform: scale(0.97); }

  /* Botão de Som Flutuante */
  .audio-control {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: rgba(6, 63, 99, 0.85);
    border: 2px solid #38bdf8;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
  }

  .toast {
    position: fixed;
    top: 28px;
    right: 78px;
    z-index: 10;
    background: rgba(3, 27, 46, 0.9);
    border: 1px solid #38bdf8;
    color: #e0f2fe;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
</style>
</head>
<body>

<!-- Gerador de Bolhas -->
<div class="bubbles-container" id="bubbles"></div>

<!-- Controle de Áudio Flutuante -->
<button class="audio-control" id="audioBtn" title="Som">🎵</button>
<div class="toast" id="toast">Toque p/ ativar música 🎵</div>

<!-- Card Principal -->
<div class="card-container">
  <div class="header-icon">🧜‍♀️</div>
  <div class="subtitle">Uma Aventura no Fundo do Mar</div>
  <h1 class="title">Eloah Oliveira</h1>
  <div class="badge">✨ 5 Aninhos ✨</div>

  <div class="info-card">
    <div class="info-row">
      <div class="info-icon">📅</div>
      <div class="info-text">
        <strong>Data & Horário</strong>
        <span>29/01/2027 às 17:00h</span>
      </div>
    </div>
    <div class="info-row">
      <div class="info-icon">📍</div>
      <div class="info-text">
        <strong>Local da Festa</strong>
        <span>Cenário Buffet</span>
        <small>Av. Miguel Estefno, 1501 - Jardim Três Marias, Guaruja (Frente à Praia da Enseada)</small>
      </div>
    </div>
  </div>

  <div class="button-group">
    <a href="https://wa.me/5513991887228?text=Olá!%20Gostaria%20de%20confirmar%20minha%20presença%20no%20aniversário%20da%20Eloah!%20✨" class="btn btn-confirm" target="_blank">
      <span>CONFIRMAR PRESENÇA</span>
    </a>
    <a href="https://www.google.com/maps/search/?api=1&query=Cenario+Buffet+Av+Miguel+Estefno+1501+Guaruja" class="btn btn-location" target="_blank">
      <span>📍 VER NO MAPA</span>
    </a>
  </div>
</div>

<!-- Player de Áudio com Áudio Direto via CDN Livre de CORS -->
<audio id="bgAudio" loop crossorigin="anonymous" preload="auto">
  <source src="https://media.vocaroo.com/mp3/18R1x54N8Lll" type="audio/mpeg">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c823485c.mp3?filename=happy-children-party-10493.mp3" type="audio/mpeg">
</audio>

<script>
  // Criador de Bolhas
  const bubblesContainer = document.getElementById('bubbles');
  for (let i = 0; i < 15; i++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random() * 20 + 10 + 'px';
    bubble.style.width = size;
    bubble.style.height = size;
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.animationDelay = Math.random() * 8 + 's';
    bubble.style.animationDuration = (Math.random() * 4 + 6) + 's';
    bubblesContainer.appendChild(bubble);
  }

  // Controle do Áudio
  const audio = document.getElementById('bgAudio');
  const audioBtn = document.getElementById('audioBtn');
  const toast = document.getElementById('toast');
  let isPlaying = false;

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.opacity = '1';
    setTimeout(() => {
      if(isPlaying) toast.style.opacity = '0';
    }, 3000);
  }

  function playAudio() {
    audio.play().then(() => {
      isPlaying = true;
      audioBtn.textContent = '🔊';
      showToast('Tocando ♪');
      removeListeners();
    }).catch(() => {
      showToast('Toque na tela p/ som 🎵');
    });
  }

  function toggleAudio(e) {
    if (e) e.stopPropagation();
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      audioBtn.textContent = '🔇';
      showToast('Pausado');
    } else {
      playAudio();
    }
  }

  function removeListeners() {
    window.removeEventListener('click', playAudio);
    window.removeEventListener('touchstart', playAudio);
  }

  window.addEventListener('click', playAudio);
  window.addEventListener('touchstart', playAudio);
  audioBtn.addEventListener('click', toggleAudio);
</script>

</body>
</html>
